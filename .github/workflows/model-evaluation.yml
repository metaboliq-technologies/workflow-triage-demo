name: Live synthetic model comparison
on:
  workflow_dispatch:
    inputs:
      model:
        description: Available Gemini structured-output model to evaluate
        required: true
        default: gemini-3.8-flash
        type: string
permissions:
  contents: read
concurrency:
  group: synthetic-model-comparison
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify frozen dataset, contracts and offline tests first
        run: npm test
      - name: Compare forty fictional requests with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ inputs.model }}
          MBQ_ALLOW_SYNTHETIC_MODEL_RUN: 'yes'
        run: npm run compare:live
      - name: Retain complete report including provider failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: synthetic-model-comparison-${{ github.run_id }}
          path: comparison.local.json
          if-no-files-found: warn
          retention-days: 14
