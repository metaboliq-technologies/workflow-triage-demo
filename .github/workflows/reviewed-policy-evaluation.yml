name: Reviewed routing policy evaluation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: synthetic-model-comparison
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify transport, diagnostics, policies and paired-run limits
        run: npm test
      - name: Compare frozen adapters against independently AI-reviewed cases
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MBQ_ALLOW_SYNTHETIC_MODEL_RUN: 'yes'
        run: |
          if test -f completeness-continuation-plan.json; then
            node completeness-continuation.mjs
          elif test -f completeness-implementation-freeze.json; then
            node completeness-evaluation.mjs
          elif test -f sensitive-continuation-plan.json; then
            node sensitive-continuation.mjs
          elif test -f sensitive-implementation-freeze.json; then
            node sensitive-evaluation.mjs
          elif test -f reliability-implementation-freeze.json; then
            node reliability-evaluation.mjs
          elif test -f negation-implementation-freeze.json; then
            node negation-evaluation.mjs
          elif test -f vague-implementation-freeze.json; then
            node vague-evaluation.mjs
          elif test -f evidence-implementation-freeze.json; then
            node evidence-evaluation.mjs
          else
            node paired-evaluation.mjs
          fi
      - name: Retain checkpoint including failures or interrupted runs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reviewed-policy-evaluation-${{ github.run_id }}
          path: |
            paired-comparison.local.json
            evidence-comparison.local.json
            vague-comparison.local.json
            negation-comparison.local.json
            reliability-comparison.local.json
            sensitive-comparison.local.json
            sensitive-continuation.local.json
            completeness-comparison.local.json
            completeness-continuation.local.json
          retention-days: 14
      - name: Print saved synthetic report without more provider calls
        if: always()
        run: |
          test ! -f paired-comparison.local.json || cat paired-comparison.local.json
          test ! -f evidence-comparison.local.json || cat evidence-comparison.local.json
          test ! -f vague-comparison.local.json || cat vague-comparison.local.json
          test ! -f negation-comparison.local.json || cat negation-comparison.local.json
          test ! -f reliability-comparison.local.json || cat reliability-comparison.local.json
          test ! -f sensitive-comparison.local.json || cat sensitive-comparison.local.json
          test ! -f sensitive-continuation.local.json || cat sensitive-continuation.local.json
          test ! -f completeness-comparison.local.json || cat completeness-comparison.local.json
          test ! -f completeness-continuation.local.json || cat completeness-continuation.local.json
