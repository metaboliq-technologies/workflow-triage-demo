name: Bounded evidence selection evaluation v12
on:
  push:
    branches: ['eval/selection-v12-2026-11-17']
    paths: ['selection-execution-plan.json']
permissions:
  contents: read
concurrency:
  group: synthetic-model-comparison
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Test contracts and frozen implementation
        run: npm test
      - name: Compare frozen adapters on newly AI-reviewed fictional requests
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MBQ_ALLOW_SYNTHETIC_MODEL_RUN: 'yes'
        run: node selection-evaluation.mjs
      - name: Retain checkpoint even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: selection-evaluation-${{ github.run_id }}
          path: selection-comparison.local.json
          retention-days: 14
      - name: Print frozen checkpoint without further model calls
        if: always()
        run: |
          if test -f selection-comparison.local.json; then
            echo SELECTION_CHECKPOINT_BEGIN
            cat selection-comparison.local.json
            echo SELECTION_CHECKPOINT_END
          fi
