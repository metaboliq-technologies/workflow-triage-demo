name: Reviewed routing policy evaluation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: synthetic-model-comparison
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify transport, diagnostics, policies and paired-run limits
        run: npm test
      - name: Compare both frozen prompts against independently AI-reviewed cases
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MBQ_ALLOW_SYNTHETIC_MODEL_RUN: 'yes'
        run: node paired-evaluation.mjs
      - name: Retain checkpoint including failures or interrupted runs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reviewed-policy-evaluation-${{ github.run_id }}
          path: paired-comparison.local.json
          retention-days: 14
      - name: Print saved synthetic report without more provider calls
        if: always()
        run: test ! -f paired-comparison.local.json || cat paired-comparison.local.json
